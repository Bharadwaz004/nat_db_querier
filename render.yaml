services:
  # ── Combined API (Node gateway + FastAPI engine, one container) ──
  - type: web
    name: nlsql-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.combined
    dockerContext: .
    plan: starter
    autoDeploy: true
    disk:
      name: nlsql-data
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /app/storage/data
      - key: EMBEDDINGS_DIR
        value: /app/storage/embeddings
      - key: GRAPH_DIR
        value: /app/storage/graph
      - key: DB_PATH
        value: /app/storage/data/sample_ecommerce.db
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: JWT_SECRET
        sync: false
