version: "3.9"

services:
  # ── FastAPI AI Engine ──────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./embeddings:/app/embeddings
      - ./graph:/app/graph
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-huggingface}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - HF_API_KEY=${HF_API_KEY}
      - HF_API_URL=${HF_API_URL:-https://router.huggingface.co/v1}
      - HF_MODEL=${HF_MODEL:-meta-llama/Llama-3.3-70B-Instruct}
      - DB_PATH=/app/data/sample_ecommerce.db
      - EMBEDDINGS_DIR=/app/embeddings
      - GRAPH_DIR=/app/graph
    restart: unless-stopped

  # ── Node.js API Gateway ────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    ports:
      - "${NODE_PORT:-3001}:3001"
    environment:
      - FASTAPI_URL=http://fastapi:8000
      - JWT_SECRET=${JWT_SECRET:-nlsql-super-secret-key-change-in-production}
      - PORT=3001
    depends_on:
      - fastapi
    restart: unless-stopped

  # ── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${VITE_PORT:-80}:80"
    depends_on:
      - gateway
    restart: unless-stopped
