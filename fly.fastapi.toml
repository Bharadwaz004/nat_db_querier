app = "nlsql-fastapi"
primary_region = "sin"

[build]
  dockerfile = "docker/Dockerfile.fastapi"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "nlsql_data"
  destination = "/app/data"
  initial_size = "1gb"
